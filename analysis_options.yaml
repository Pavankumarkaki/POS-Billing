include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # Money and tax bugs are silent. Anything the analyser can catch should fail
    # the build, not warn.
    invalid_assignment: error
    argument_type_not_assignable: error
    unused_import: error
    dead_code: error
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_const_constructors
    - unnecessary_await_in_return
    - require_trailing_commas
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - throw_in_finally
    - unawaited_futures
