<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Lekka mark: a receipt coming out of the machine that printed it.

  This file is the portable copy, for signage, a letterhead or a web page.
  The copy that ships inside the app is drawn in code, in
  lib/theme/brand.dart, and test/brand_icons_test.dart renders the launcher
  PNGs from that. The two are the same geometry on a 512 grid, so a change
  here has to be made there as well.

  Colours are the app's own: primary #0F4A33, surface #FFFFFF, accent #F4B400.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lekka: a receipt emerging from a printer">

  <!-- the rounded square. Drop this layer for an Android adaptive foreground. -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#0F4A33"/>

  <!-- the slip, torn across the top the way a thermal printer leaves it -->
  <path fill="#FFFFFF" d="
    M208,300
    L304,300
    L304,142
    L288,118 L272,142
    L256,118 L240,142
    L224,118 L208,142
    Z"/>

  <!-- the printed total: the one line anybody actually reads -->
  <line x1="228" y1="204" x2="284" y2="204"
        stroke="#F4B400" stroke-width="20" stroke-linecap="round"/>

  <!-- the machine, and the slot the slip goes into -->
  <rect x="146" y="290" width="220" height="88" rx="30" ry="30" fill="#FFFFFF"/>
  <rect x="196" y="282" width="120" height="20" rx="9" ry="9" fill="#0F4A33"/>
</svg>
